name: Deploy API

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 705942571816.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: flowstack/api
  EC2_INSTANCE_ID: i-0f525833a83721d7f

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids $EC2_INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 705942571816.dkr.ecr.eu-north-1.amazonaws.com",
              "docker pull 705942571816.dkr.ecr.eu-north-1.amazonaws.com/flowstack/api:latest",
              "docker stop flowstack-api || true",
              "docker rm flowstack-api || true",
              "docker run -d --name flowstack-api --restart unless-stopped -p 3000:3000 --env-file /etc/flowstack/api.env 705942571816.dkr.ecr.eu-north-1.amazonaws.com/flowstack/api:latest"
            ]' \
            --output text
